name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # Frontend unit tests (virtual layout editing + suggestion logic).
      - name: Frontend unit tests
        run: npm test

      # Mirrors the release build (frontend build + Tauri version-sync check
      # + Rust compile) but skips slow installer packaging via --no-bundle.
      # Keeping this in sync with release.yml means a green CI implies a green release.
      - name: Build Tauri app (no bundle)
        run: npm run tauri build -- --no-bundle

      # Unit tests (export placement math). Runs after the build so the
      # frontend dist that tauri::generate_context! needs already exists.
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
